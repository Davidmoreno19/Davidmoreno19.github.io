<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esfera → Elipsoide</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#d8dce3;--surf:37,99,235;--ref:#9aa3b2;
--y:#d99a00;--g:#16a34a;--o:#ea580c;--white:#1c2230;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#98a2b3;--line:#2a2f3a;--surf:96,165,250;--ref:#7b8494;--y:#facc15;--g:#4ade80;--o:#fb923c;--white:#fff}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#171a21;--ink:#e8eaf0;--mute:#98a2b3;--line:#2a2f3a;--surf:96,165,250;--ref:#7b8494;--y:#facc15;--g:#4ade80;--o:#fb923c;--white:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
#c3{width:100%;aspect-ratio:1/1;display:block;touch-action:none;cursor:grab}
.side{display:grid;grid-template-rows:repeat(3,1fr);gap:12px}
.side .card{display:flex;flex-direction:column}
.side canvas{width:100%;aspect-ratio:1/1;display:block;max-height:100%}
.t{font-size:13px;font-weight:600;margin-bottom:2px}
.ctrl{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 24px}
.ctrl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.ctrl b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:4px 0 0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer}
.f{font-size:13px;color:var(--mute);margin-left:auto}
.f span{margin-left:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.side{grid-template-rows:none;grid-template-columns:repeat(3,1fr)}.side .card{padding:6px}.t{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Esfera → Elipsoide</h1>
<div class="grid">
  <div class="card"><canvas id="c3"></canvas></div>
  <div class="side">
    <div class="card"><div class="t" style="color:var(--y)">Traza xy (z = 0)</div><canvas id="p0"></canvas></div>
    <div class="card"><div class="t" style="color:var(--g)">Traza xz (y = 0)</div><canvas id="p1"></canvas></div>
    <div class="card"><div class="t" style="color:var(--o)">Traza yz (x = 0)</div><canvas id="p2"></canvas></div>
  </div>
</div>
<div class="ctrl">
  <div><label>Transformación <b id="vk">0 %</b></label><input id="k" type="range" min="0" max="100" value="0"></div>
  <div><label>b (semieje y) <b id="vb">1.20</b></label><input id="b" type="range" min="0.2" max="3" step="0.05" value="1.2"></div>
  <div><label>c (semieje z) <b id="vc">0.80</b></label><input id="c" type="range" min="0.2" max="3" step="0.05" value="0.8"></div>
  <div><label>Rotación <b id="va">-50°</b></label><input id="a" type="range" min="-180" max="180" value="-50"></div>
  <div><label>Elevación <b id="ve">25°</b></label><input id="e" type="range" min="-90" max="90" value="25"></div>
  <div><label>Posición x de los semiejes <b id="vx">1.20</b></label><input id="x" type="range" min="-2" max="2" step="0.01" value="1.2"></div>
</div>
<div class="row">
  <button id="play">▶ Animar</button><button id="reset">Restablecer</button>
  <div class="f"><span style="color:var(--y)">y′ = (b/r)·√(r²−x²)</span><span style="color:var(--g)">z′ = (c/r)·√(r²−x²)</span></div>
</div>
</div>
<script>
const R=2,$=id=>document.getElementById(id);
const S={k:0,b:1.2,c:0.8,a:-50,e:25,x:1.2};
const ids=["k","b","c","a","e","x"],fmt={x:v=>(+v).toFixed(2),k:v=>v+" %",b:v=>(+v).toFixed(2),c:v=>(+v).toFixed(2),a:v=>v+"°",e:v=>v+"°"};
const cv=$("c3"),ctx=cv.getContext("2d"),pc=[0,1,2].map(i=>$("p"+i));
let col={},pend=false;
function readCols(){const s=getComputedStyle(document.documentElement);
 for(const n of["ink","ref","y","g","o","white","surf"])col[n]=s.getPropertyValue("--"+n).trim();}
function fit(c){const d=devicePixelRatio||1,w=c.clientWidth;if(!w)return;c.width=w*d;c.height=w*d;}
function resize(){[cv,...pc].forEach(fit);readCols();draw();}
function req(){if(!pend){pend=true;requestAnimationFrame(()=>{pend=false;draw();});}}
function draw(){
 const k=S.k/100,sy=1+(S.b/R-1)*k,sz=1+(S.c/R-1)*k;
 const L=Math.max(R,S.b,S.c)*1.15;
 // 3D
 const W=cv.width,sc=W/2/L*0.92,cx=W/2,cy=W/2,A=S.a*Math.PI/180,E=S.e*Math.PI/180;
 const cA=Math.cos(A),sA=Math.sin(A),cE=Math.cos(E),sE=Math.sin(E);
 const P=(x,y,z)=>{const x1=x*cA-y*sA,y1=x*sA+y*cA;return[cx+sc*x1,cy-sc*(z*cE-y1*sE),y1*cE+z*sE];};
 ctx.clearRect(0,0,W,W);ctx.lineCap="round";
 const lw=W/500;
 const poly=(f,n,color,width,dash,alpha)=>{
  ctx.strokeStyle=color;ctx.lineWidth=width*lw;ctx.setLineDash(dash?[6*lw,5*lw]:[]);ctx.globalAlpha=alpha||1;
  ctx.beginPath();for(let i=0;i<=n;i++){const p=f(i/n*2*Math.PI),q=P(p[0],p[1],p[2]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}
  ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;};
 // malla de la superficie con atenuacion por profundidad
 ctx.lineWidth=0.8*lw;
 const seg=(f,n)=>{let p0=f(0),q0=P(...p0);for(let i=1;i<=n;i++){const p1=f(i/n),q1=P(...p1);
   const d=(q0[2]+q1[2])/2/(R*1.5);ctx.globalAlpha=Math.max(0.05,Math.min(0.5,0.28-d*0.2));
   ctx.strokeStyle="rgb("+col.surf+")";ctx.beginPath();ctx.moveTo(q0[0],q0[1]);ctx.lineTo(q1[0],q1[1]);ctx.stroke();q0=q1;}};
 const X=(u,v)=>[R*Math.sin(v)*Math.cos(u),sy*R*Math.sin(v)*Math.sin(u),sz*R*Math.cos(v)];
 for(let i=0;i<24;i++){const u=i/24*2*Math.PI;seg(t=>X(u,t*Math.PI),32);}
 for(let j=1;j<12;j++){const v=j/12*Math.PI;seg(t=>X(t*2*Math.PI,v),48);}
 ctx.globalAlpha=1;
 // circunferencias originales
 poly(t=>[R*Math.cos(t),R*Math.sin(t),0],96,col.ref,1.2,1,0.8);
 poly(t=>[R*Math.cos(t),0,R*Math.sin(t)],96,col.ref,1.2,1,0.8);
 poly(t=>[0,R*Math.cos(t),R*Math.sin(t)],96,col.ref,1.2,1,0.8);
 // trazas
 poly(t=>[R*Math.cos(t),sy*R*Math.sin(t),0],96,col.y,3);
 poly(t=>[R*Math.cos(t),0,sz*R*Math.sin(t)],96,col.g,3);
 poly(t=>[0,sy*R*Math.cos(t),sz*R*Math.sin(t)],96,col.o,3);
 // alturas en x0
 const x0=S.x,h=Math.sqrt(Math.max(0,R*R-x0*x0));
 const ln=(a,b,color,w)=>{const p=P(...a),q=P(...b);ctx.strokeStyle=color;ctx.lineWidth=w*lw;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();};
 ln([x0,0,0],[x0,h,0],col.white,2);ln([x0,0,0],[x0,0,h],col.white,2);
 ln([x0,0,0],[x0,sy*h,0],col.y,4.5);ln([x0,0,0],[x0,0,sz*h],col.g,4.5);
 // paneles 2D
 const spec=[[col.y,1,sy],[col.g,1,sz],[col.o,sy,sz]];
 pc.forEach((c,i)=>{const g=c.getContext("2d"),w=c.width,s=w/2/L*0.92,l=w/500;
  g.clearRect(0,0,w,w);
  g.strokeStyle=col.ref;g.lineWidth=1.2*l*1.4;g.setLineDash([6*l*1.4,5*l*1.4]);
  g.beginPath();g.arc(w/2,w/2,R*s,0,7);g.stroke();g.setLineDash([]);
  g.strokeStyle=spec[i][0];g.lineWidth=3*l*1.4;g.beginPath();
  g.ellipse(w/2,w/2,R*spec[i][1]*s,R*spec[i][2]*s,0,0,2*Math.PI);g.stroke();});
}
// controles en vivo
ids.forEach(id=>{const el=$(id);el.addEventListener("input",()=>{S[id]=+el.value;$("v"+id).textContent=fmt[id](el.value);req();});});
function setS(id,v){S[id]=v;$(id).value=v;$("v"+id).textContent=fmt[id](v);}
// arrastrar para rotar
let drag=null;
cv.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing";});
cv.addEventListener("pointermove",e=>{if(!drag)return;
 const dx=e.clientX-drag[0],dy=e.clientY-drag[1];drag=[e.clientX,e.clientY];
 let a=S.a+dx*0.5;a=((a+180)%360+360)%360-180;
 setS("a",Math.round(a));setS("e",Math.round(Math.max(-90,Math.min(90,S.e+dy*0.5))));req();});
cv.addEventListener("pointerup",()=>{drag=null;cv.style.cursor="grab";});
// animar
let anim=null,t0=0;
$("play").onclick=()=>{
 if(anim){cancelAnimationFrame(anim);anim=null;$("play").textContent="▶ Animar";return;}
 $("play").textContent="⏸ Pausar";t0=performance.now();
 const step=now=>{const ph=((now-t0)/6000)%1,k=ph<0.5?ph*2:2-ph*2,e=k*k*(3-2*k);
  setS("k",Math.round(e*100));draw();anim=requestAnimationFrame(step);};
 anim=requestAnimationFrame(step);};
$("reset").onclick=()=>{if(anim){cancelAnimationFrame(anim);anim=null;$("play").textContent="▶ Animar";}
 setS("k",0);setS("b",1.2);setS("c",0.8);setS("a",-50);setS("e",25);setS("x",1.2);draw();};
addEventListener("resize",resize);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readCols();draw();});
resize();
</script>
</body>
</html>
